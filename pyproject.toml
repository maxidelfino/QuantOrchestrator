[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "quant-orchestrator"
version = "2.0.0"
description = "Multi-strategy BTC trading bot — trend-following + momentum"

[tool.pytest.ini_options]
pythonpath = [".", "bots/python"]
addopts = "-q"
