# TODO: Copy this template and rename strategy keys for your new bot.

exchange:
  venue: hyperliquid
  symbol: BTC/USDC:USDC
  testnet: true
  timeframe: 4h
  leverage: 1

strategy:
  # Required: dotted class path used by dynamic strategy loader.
  # Example: exchanges.hyperliquid.bots.my_bot.strategy.MyBotStrategy
  strategy_class: exchanges.hyperliquid.bots.template.strategy.TemplateStrategy
  # TODO: Replace with your strategy parameters.
  ema_fast: 50
  ema_slow: 200
  ema_regime_daily: 200
  atr_period: 14
  stop_atr_mult: 3.0
  risk_pct: 0.02
  enabled: true

execution:
  entry_order_type: limit
  entry_ttl_bars: 3
  exit_stop_type: market
  exit_planned_type: market
  limit_price_offset: 0.0001
  post_only: true

risk:
  max_daily_loss_pct: 0.05
  max_drawdown_pct: 0.25
  min_order_size_usd: 5.0
